<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Circle (Optional framing, modern dark theme base) -->
  <rect width="512" height="512" rx="112" fill="#0F172A" />

  <!-- Outer Circular Progress Ring (Represents Routine & Consistency) -->
  <path 
    d="M 256 96 
       A 160 160 0 1 1 120 176" 
    fill="none" 
    stroke="#38BDF8" 
    stroke-width="36" 
    stroke-linecap="round" 
  />

  <!-- The "X" formed by an Overlapping Checkmark + Intersecting Accent (Represents Routine + X) -->
  <!-- Checkmark Arm 1 (Down stroke) -->
  <path 
    d="M 170 256 L 240 326" 
    stroke="#4ADE80" 
    stroke-width="40" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Checkmark Arm 2 extending into the main diagonal of the X -->
  <path 
    d="M 240 326 L 360 180" 
    stroke="#4ADE80" 
    stroke-width="40" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Intersecting diagonal completing the 'X' -->
  <path 
    d="M 350 326 L 220 180" 
    stroke="#38BDF8" 
    stroke-width="40" 
    stroke-linecap="round" 
  />
</svg>
